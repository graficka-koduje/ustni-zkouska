<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Písemná zkouška – početní úlohy</title>
<style>
:root{--ink:#1f2430;--muted:#5b6170;--line:#d9dce3;--bg:#f6f7f9;--card:#fff;--pur:#6b5fd3;--purL:#eeedfe;--cor:#d85a30;--corL:#fae3d9;--teal:#0f6e56;--tealL:#d6f1e7;--amb:#ba7517;--ambL:#fdf0d8;--mag:#e0007a;--grn:#2f7d32;--grnL:#e8f5e9;--red:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Calibri,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:17px}
.wrap{max-width:920px;margin:0 auto;padding:16px}
header{background:var(--card);border-bottom:4px solid var(--grn);padding:18px 0}
header .wrap{padding:0 16px}
.tag{display:inline-block;background:var(--grnL);color:var(--grn);border:1px solid #a5d6a7;border-radius:20px;padding:2px 12px;font-size:14px;font-weight:600}
h1{font-size:24px;margin:8px 0 2px}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:19px;margin:0 0 6px}
.sub{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}
.grp{margin:18px 0 6px;font-size:17px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-left:5px solid var(--pur);border-radius:0;padding:10px 12px}
.tile b{display:block;font-size:15px;color:var(--pur)}
.tile:hover{background:var(--purL)}
.zadani img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.ukol{border:2px solid var(--ink);border-radius:10px;padding:10px 14px;margin:10px 0;background:#fff}
.ukol ul{margin:4px 0;padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border-radius:8px;padding:5px 10px;font-size:16px;background:#f0f1f5;border:1px solid #c9ccd6}
.chip.cor{background:var(--corL);border-color:var(--cor)}
.chip.teal{background:var(--tealL);border-color:var(--teal)}
.chip.pur{background:var(--purL);border-color:var(--pur)}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--pur);color:#fff;margin:4px 6px 4px 0}
.btn.sec{background:#e7e8ee;color:var(--ink)}
.btn.grn{background:var(--grn)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-size:15px;color:var(--muted)}
.dot.on{border-color:var(--pur);background:var(--pur);color:#fff}
.dot.done{border-color:var(--pur);color:var(--pur)}
.step{display:none}.step.on{display:block}
svg{width:100%;height:auto;display:block;margin:6px 0}
.calc{display:none;background:var(--ambL);border-left:5px solid var(--amb);padding:10px 14px;margin:10px 0;font-size:18px}
.calc.on{display:block}
.calc p{margin:4px 0}
.hint{background:var(--purL);border-left:5px solid var(--pur);padding:8px 14px;margin:8px 0;font-size:18px;min-height:44px}
.res{font-weight:700;color:var(--mag)}
.note{color:var(--muted);font-size:15px}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
table.vys{width:100%;border-collapse:collapse;font-size:18px;margin:8px 0}
table.vys td{border:2px solid #222;padding:7px 9px}
table.vys td.l{font-weight:700;width:8%}
table.vys input,table.vys select{width:100%;font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff}
.inrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.inrow label{min-width:230px;font-weight:600}
.inrow input{width:150px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
input.ok,select.ok{border-color:var(--grn)!important;background:var(--grnL)!important}
input.bad,select.bad{border-color:var(--red)!important;background:#fdecea!important}
.gridin{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid #222;max-width:420px;margin:6px 0 14px}
.gridin input{font:inherit;font-size:18px;text-align:center;width:100%;padding:16px 2px;border:0;border-radius:0;display:block}
.gridin .c0,.gridin .c2{border-right:2px dashed #0f6e56}
.gridin .c1{border-right:2px solid #222}
.gridin .r0{border-bottom:2px solid #222}
.gridin input.top{transform:rotate(180deg)}
.msg{font-weight:600;margin:6px 0}
.sol{display:none;border:2px solid var(--mag);border-radius:10px;padding:10px 14px;margin:10px 0;color:var(--mag)}
.sol.on{display:block}
.sol b{color:var(--mag)}
.sol table.vys td{color:var(--mag)}
.sol table.vys td.k{color:var(--ink)}
.up{position:fixed;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;background:var(--pur);color:#fff;font-size:22px;border:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.topnav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
@media (max-width:600px){body{font-size:16px}h1{font-size:21px}.inrow label{min-width:0;width:100%}.calc,.hint{font-size:16px}}
</style>
</head>
<body>
<header><div class="wrap">
<a href="../" style="float:right;color:#6b5fd3;font-weight:600;text-decoration:none">← Rozcestník</a><span class="tag">📝 Písemná zkouška – výpočetní a grafické úlohy</span>
<h1>Písemná zkouška – početní úlohy</h1>
<p class="sub">Zadání → řešení krok za krokem → vyzkoušej sám</p>
</div></header>

<div class="wrap">
<section id="home"></section>
<section id="task"></section>
</div>
<button class="up" aria-label="Nahoru" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
/* ---------- pomocné kreslení ---------- */
const C={pur:'#6b5fd3',purL:'#eeedfe',cor:'#d85a30',corL:'#fae3d9',teal:'#0f6e56',tealL:'#d6f1e7',amb:'#ba7517',ambL:'#fdf0d8',ink:'#1f2430',mag:'#e0007a',gray:'#e4e4e4',mut:'#5b6170'};
const F='font-family="Segoe UI,Arial,sans-serif"';
function T(x,y,s,o={}){return `<text x="${x}" y="${y}" font-size="${o.fs||15}" font-weight="${o.b?700:400}" fill="${o.c||C.ink}" text-anchor="${o.a||'middle'}" dominant-baseline="central" ${F}>${s}</text>`}
function R(x,y,w,h,f,s,sw=1,ex=''){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" stroke="${s}" stroke-width="${sw}" ${ex}/>`}
function L(x1,y1,x2,y2,s=C.ink,sw=1,ex=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${sw}" ${ex}/>`}
function V(v,k){return k?`<tspan fill="${C.mag}" font-weight="700">${v}</tspan>`:'<tspan fill="#999">?</tspan>'}
function TV(x,y,pre,v,k,o={}){return `<text x="${x}" y="${y}" font-size="${o.fs||15}" font-weight="${o.b?700:400}" fill="${C.ink}" text-anchor="${o.a||'middle'}" dominant-baseline="central" ${F}>${pre}${V(v,k)}</text>`}
function dH(x1,x2,y){return L(x1,y,x2,y)+L(x1,y-6,x1,y+6)+L(x2,y-6,x2,y+6)}
function dV(x,y1,y2){return L(x,y1,x,y2)+L(x-6,y1,x+6,y1)+L(x-6,y2,x+6,y2)}

/* B0 -> B1 */
function svgB0(r){let s='';s+=R(240,40,220,311,'#fff',C.ink,2);s+=R(240,40,220,155.5,r?C.purL:'#fff',r?C.pur:C.ink,r?2:0);
 s+=L(240,195.5,460,195.5,C.pur,2,'stroke-dasharray="8 5"');s+=T(350,118,'B1',{fs:22,b:1,c:r?C.pur:'#bbb'})+T(350,273,'B1',{fs:22,b:1,c:r?C.pur:'#bbb'});
 s+=dH(240,460,26)+T(350,12,'1000 mm',{b:1});s+=dV(490,40,351)+T(500,195,'B0: 1414 mm',{a:'start',b:1});
 s+=dV(210,40,195.5)+TV(200,118,'',' 707 mm',r,{a:'end'});s+=T(350,368,'Arch B0 rozpůlím → 2 × B1',{c:C.mut,fs:14});return svg(380,s)}
/* jedna stránka / tiskovina */
function svgPage(o){ // o:{w,h,label,sub,top,bot,left,right,lc,rc,W,H,r}
 let s='';const x=250,y=50,w=212,h=280;
 s+=R(x,y,w,h,(o.addAll||o.spine||o.v1)?C.corL:'#fff',C.cor,1);
 if(o.spine)s+=R(x,y,12,h,C.tealL,C.teal,1);

 s+=R(ix,iy,iw,ih,C.purL,C.pur,1.5);s+=T(ix+iw/2,iy+ih/2-12,o.label,{fs:20,b:1,c:C.pur})+T(ix+iw/2,iy+ih/2+12,o.sub,{fs:14,c:C.pur});
 if(o.top)s+=T(x+w/2,36,o.top,{c:C.cor,b:1});if(o.bot)s+=T(x+w/2,346,o.bot,{c:C.cor,b:1});
 if(o.left)s+=T(x-10,176,o.left[0],{a:'end',c:o.lc||C.teal,b:1})+T(x-10,196,o.left[1],{a:'end',c:o.lc||C.teal,b:1});
 if(o.right)s+=T(x+w+10,176,o.right[0],{a:'start',c:C.cor,b:1})+T(x+w+10,196,o.right[1],{a:'start',c:C.cor,b:1});
 s+=dH(x,x+w,370)+TV(x+w/2,392,'šířka = ',o.W,o.r);s+=dV(600,y,y+h)+T(600,30,'výška',{fs:14})+TV(612,190,'',o.H,o.r,{a:'start'});
 return svg(405,s)}
/* montážní plán úkol 1 */
function sheet1(o){let s='';const bx=[80,190,300,410],ry=[110,256];
 s+=R(40,60,520,50,o.hl==='F'?C.ambL:'#fff','none',0);s+=R(40,110,40,292,o.hl==='E'?C.ambL:'#fff','none',0)+R(520,110,40,292,o.hl==='E'?C.ambL:'#fff','none',0);
 s+=R(40,402,520,20,C.gray,'#888',.5)+T(300,412,'náložka 15 mm',{fs:13});
 ry.forEach(y=>bx.forEach(x=>{s+=R(x,y,110,146,C.corL,C.cor,.7)}));s+=R(182,110,16,292,C.tealL,C.teal,.7)+R(402,110,16,292,C.tealL,C.teal,.7);
 s+=L(190,104,190,408,C.teal,1.2,'stroke-dasharray="5 4"')+L(410,104,410,408,C.teal,1.2,'stroke-dasharray="5 4"');
 [88,198,308,418].forEach(x=>ry.forEach(y=>{s+=R(x,y+8,94,130,C.purL,C.pur,1)+T(x+47,y+73,'A4',{fs:17,b:1,c:C.pur})}));
 s+=TV(300,85,'F = ',o.F+' mm',o.F,{fs:16,b:1});s+=T(60,246,'E',{fs:16,b:1})+T(540,246,'E',{fs:16,b:1})+TV(60,268,'',o.E,o.E,{fs:14})+TV(540,268,'',o.E,o.E,{fs:14});
 s+=R(40,60,520,362,'none',C.ink,2);const xs=[40,80,190,300,410,520,560];
 s+=L(40,440,560,440,C.ink,.8);xs.forEach(x=>s+=L(x,434,x,446,C.ink,.8));bx.forEach(x=>s+=TV(x+55,456,'','218',o.ch,{fs:14}));
 s+=T(300,490,'B = 1000 mm',{b:1})+dH(40,560,476);const ys=[60,110,256,402,422];

 s+=T(588,412,'15',{a:'start',fs:14})+TV(588,85,'',o.F,o.F,{fs:14,a:'start'});s+=dV(632,60,422)+T(642,232,'A =',{a:'start',b:1,fs:14})+T(642,252,'707',{a:'start',b:1,fs:14});
 s+=T(300,510,'Nákres není v měřítku – přídavky jsou zvětšené.',{fs:13,c:C.mut});return svg(475,s,45)}

function plan12(o){const k=0.792,x0=50,y0=50,W=707*k,H=500*k,E=57.5*k,Fh=65*k,cw=148*k,ch=210*k,N=15*k;let s='';
 s+=R(x0,y0,W,Fh,o.hl==='F'?C.ambL:'#fff','none',0);s+=R(x0,y0+Fh,E,2*ch,o.hl==='E'?C.ambL:'#fff','none',0)+R(x0+W-E,y0+Fh,E,2*ch,o.hl==='E'?C.ambL:'#fff','none',0);
 s+=R(x0,y0+H-N,W,N,C.gray,'#888',.5)+T(x0+W/2,y0+H-N/2,'náložka 15 mm',{fs:11});
 let n=1;for(let r=0;r<2;r++)for(let c=0;c<4;c++){const x=x0+E+c*cw,y=y0+Fh+r*ch;const lr=o.lr?(c<2?'L':'R'):'';
  s+=R(x,y,cw,ch,lr==='L'?C.purL:lr==='R'?C.tealL:'#fff',C.ink,1);s+=T(x+cw/2,y+ch/2-(lr?10:0),n,{fs:22,b:1,c:lr==='L'?C.pur:lr==='R'?C.teal:C.ink});
  if(lr)s+=T(x+cw/2,y+ch/2+16,lr==='L'?'líc':'rub',{fs:15,b:1,c:lr==='L'?C.pur:C.teal});n++}
 const cx=x0+E+cw,cy=y0+Fh;s+=TV(cx+8,cy+18,'C = ',o.C?'210':'',o.C,{a:'start',fs:13});s+=TV(cx+cw/2,cy+ch-14,'D = ',o.D?'148':'',o.D,{fs:13});
 s+=T(x0+E/2,y0+Fh+ch,'E',{b:1})+TV(x0+E/2,y0+Fh+ch+20,'',o.E?'57,5':'',o.E,{fs:13});s+=T(x0+W-E/2,y0+Fh+ch,'E',{b:1})+TV(x0+W-E/2,y0+Fh+ch+20,'',o.E?'57,5':'',o.E,{fs:13});
 s+=TV(x0+W/4,y0+Fh/2,'F = ',o.F?'65 mm':'',o.F,{b:1});
 s+=R(x0,y0,W,H,'none',C.ink,2);s+=dH(x0,x0+W,28)+T(x0+W/2,14,'B = 707 mm',{b:1});s+=dV(x0+W+22,y0,y0+H)+T(x0+W+32,y0+H/2,'A =',{a:'start',b:1,fs:14})+T(x0+W+32,y0+H/2+18,'500',{a:'start',b:1,fs:14});
 if(o.chain){s+=L(x0,y0+H+18,x0+W,y0+H+18,C.ink,.8);[0,E,E+cw,E+2*cw,E+3*cw,E+4*cw,W].forEach(d=>s+=L(x0+d,y0+H+12,x0+d,y0+H+24,C.ink,.8));
  [0,1,2,3].forEach(i=>s+=T(x0+E+i*cw+cw/2,y0+H+34,'148',{fs:13}));}
 if(o.lr)s+=L(x0+W/2,y0-6,x0+W/2,y0+H+6,C.mag,2,'stroke-dasharray="6 4"');

/* užitek papíru – rozložení na archu */

 const nx=Math.floor(W/cw),ny=Math.floor(H/ch);s+=R(x0,y0,w,h,'#f3f3f3',C.ink,2);
 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){s+=R(x0+i*cw*sc,y0+j*ch*sc,cw*sc,ch*sc,o.col?(o.col(i,j,nx)):C.purL,C.pur,1);
  if(o.lab)s+=T(x0+(i+.5)*cw*sc,y0+(j+.5)*ch*sc,o.lab(i,j,nx),{fs:12,b:1,c:C.pur})}
 s+=dH(x0,x0+w,22)+T(x0+w/2,8,W+' mm',{b:1});s+=dV(x0+w+20,y0,y0+h)+T(x0+w+30,y0+h/2,H+' mm',{a:'start',b:1});
 s+=dH(x0,x0+cw*sc,y0+h+16)+T(x0+cw*sc/2,y0+h+32,cw,{fs:13,c:C.pur,b:1});s+=dV(x0-16,y0,y0+ch*sc)+T(x0-24,y0+ch*sc/2,ch,{fs:13,c:C.pur,b:1,a:'end'});
 s+=TV(x0+w+30,y0+h/2+40,'vedle sebe: ',nx,r,{a:'start'})+TV(x0+w+30,y0+h/2+64,'pod sebou: ',ny,r,{a:'start'})+TV(x0+w+30,y0+h/2+92,'celkem: ',nx*ny+(o.x2?' × 2 = '+nx*ny*2:''),r,{a:'start',b:1});
 s+=T(x0+w/2,y0+h+56,'šedá = zbytek papíru',{fs:13,c:C.mut});return svg(y0+h+70,s)}
/* arch s plochou (hmotnost) */
function svgMass(a,b,am,bm,stage,o){let s='';const x=170,y=40,w=o.w||220,h=o.h||300;
 s+=R(x,y,w,h,C.purL,C.pur,2);s+=dH(x,x+w,24)+TV(x+w/2,10,'',stage>=1?am+' m':a+' mm',true,{b:1});
 s+=dV(x+w+20,y,y+h)+TV(x+w+30,y+h/2,'',stage>=1?bm+' m':b+' mm',true,{a:'start',b:1});
 s+=TV(x+w/2,y+h/2-14,'plocha = ',o.area+' m²',stage>=2,{fs:15,b:1});s+=TV(x+w/2,y+h/2+14,'váha = ',o.one,stage>=3,{fs:15,b:1});
 return svg(y+h+30,s)}
/* vyřazení – jedna strana archu */
function side(x0,top,bot,o={}){let s='';const w=300,h=190,y0=28,cw=75,rh=95;
 if(o.title)s+=T(x0+w/2,12,o.title,{b:1,fs:14,c:o.tc||C.ink});
 for(let r=0;r<2;r++)for(let c=0;c<4;c++){const n=(r?bot:top)[c];const hl=o.hl&&o.hl.includes(n);s+=R(x0+c*cw,y0+r*rh,cw,rh,hl?C.ambL:(o.fill?o.fill(c):'#fff'),'none',0)}
 s+=R(x0,y0,w,h,'none',C.ink,1.5)+L(x0,y0+rh,x0+w,y0+rh,C.ink,1.2)+L(x0+2*cw,y0,x0+2*cw,y0+h,C.ink,1.2);
 [1,3].forEach(c=>s+=L(x0+c*cw,y0,x0+c*cw,y0+h,C.teal,1.4,'stroke-dasharray="6 4"'));
 for(let c=0;c<4;c++){const cx=x0+c*cw+cw/2;const tn=top[c],bn=bot[c];const show=n=>!o.show||o.show(n);
  if(show(tn))s+=`<g transform="rotate(180 ${cx} ${y0+30})">${T(cx,y0+30,tn,{fs:20,b:1,c:o.hl&&o.hl.includes(tn)?C.mag:C.ink})}${L(cx-12,y0+42,cx+12,y0+42,C.ink,1.2)}</g>`;
  if(show(bn))s+=T(cx,y0+h-30,bn,{fs:20,b:1,c:o.hl&&o.hl.includes(bn)?C.mag:C.ink});}
 if(o.ka)s+=R(x0+3*cw-3,y0+rh+2,6,16,'#e02020','none',0)+T(x0+3*cw-8,y0+rh+12,o.ka,{fs:11,a:'end',c:'#e02020'});
 return s}
function pair(t1,b1,t2,b2,o={}){return svg(230,side(20,t1,b1,Object.assign({title:o.t1||'líc'},o,o.o1||{}))+side(360,t2,b2,Object.assign({title:o.t2||'rub'},o,o.o2||{})))}
function single(t,b,o={}){return svg(230,side(190,t,b,o))}
const add=(a,k)=>a.map(n=>n+k);
const V2L=[[5,12,9,8],[4,13,16,1]],V2R=[[7,10,11,6],[2,15,14,3]];

/* ---------- ÚLOHY ---------- */

{n:10,g:'Užitek papíru a spotřeba TA',name:'Vizitka – užitek papíru a spotřeba TA',

function home(){const g={};TASKS.forEach(t=>{(g[t.g]=g[t.g]||[]).push(t)});
 let h='<div class="card"><h2>Vyber úlohu</h2>';Object.keys(g).forEach(k=>{h+=`<div class="grp">${k}</div><div class="tiles">`+g[k].map(t=>`<a class="tile" href="#u${t.n}"><b>Úkol ${t.n}</b>${t.name}</a>`).join('')+'</div>'});
 return h+'</div>'}

function openTask(n){task=TASKS.find(t=>t.n===n);stage={};cur=1;const el=document.getElementById('task');
 let h=`<div class="topnav"><a class="btn sec" href="#">← Všechny úlohy</a>${n<12?`<a class="btn sec" href="#u${n+1}">Další úloha →</a>`:''}</div>`;
 h+=`<section class="card zadani"><h2>Úkol ${n} – ${task.name}</h2><h3>Zadání</h3>${task.zad}<button class="btn" onclick="document.getElementById('res').scrollIntoView({behavior:'smooth'})">Řešit krok za krokem ↓</button><button class="btn sec" onclick="document.getElementById('fin').scrollIntoView({behavior:'smooth'})">Rovnou vyzkoušet ↓</button></section>`;
 h+=`<section class="card" id="res"><h2>Řešení krok za krokem</h2><div class="dots" id="dots"></div>`;
 task.steps.forEach((s,i)=>{const k=s.k||1;h+=`<div class="step" data-s="${i+1}"><h3>${i+1}. ${s.t}</h3>${s.chips?`<div class="chips">${s.chips}</div>`:''}<div class="ukol">${s.q}</div><div id="sv${i+1}"></div>${s.hints?`<div class="hint" id="hi${i+1}">Klikni na tlačítko.</div>`:''}
  <button class="btn" id="bt${i+1}" onclick="more(${i+1})">${k>1?'Další ▶':(s.b||'Ukaž výpočet')}</button>${k>1?`<button class="btn sec" onclick="all_(${i+1})">Ukaž vše</button><button class="btn sec" onclick="reset_(${i+1})">Od začátku</button>`:''}
  <div class="calc" id="c${i+1}">${s.c}</div></div>`});
 h+=`<div class="nav"><button class="btn sec" id="prev" onclick="go(cur-1)">← Zpět</button><button class="btn" id="next" onclick="go(cur+1)">Další krok →</button></div></section>`;
 h+=`<section class="card" id="fin">${finHTML(task)}</section>`;
 el.innerHTML=h;if(task.zadSvg)document.getElementById('plan12zad').innerHTML=task.zadSvg();go(1)}
function draw(i){const s=task.steps[i-1];document.getElementById('sv'+i).innerHTML=s.svg(stage[i]||0);const k=s.k||1,r=stage[i]||0;
 if(s.hints)document.getElementById('hi'+i).innerHTML=r?s.hints.slice(0,r).map((x,j)=>j===r-1?x:`<span class="note">${x.replace(/<\/?b>/g,'')}</span>`).join('<br>'):'Klikni na tlačítko <b>Další ▶</b>.';
 document.getElementById('c'+i).classList.toggle('on',r>=k);const bt=document.getElementById('bt'+i);
 if(k>1){bt.disabled=r>=k;bt.textContent=r>=k?'Hotovo ✔':`Další ▶ (${r+1}/${k})`}else bt.textContent=r?'Skrýt výpočet':(s.b||'Ukaž výpočet')}
function more(i){const k=task.steps[i-1].k||1;stage[i]=k>1?Math.min((stage[i]||0)+1,k):(stage[i]?0:1);draw(i);dots()}
function all_(i){stage[i]=task.steps[i-1].k;draw(i);dots()}
function reset_(i){stage[i]=0;draw(i);dots()}
function dots(){const d=document.getElementById('dots');d.innerHTML='';const N=task.steps.length;for(let i=1;i<=N;i++){const b=document.createElement('button');b.className='dot'+(i===cur?' on':'')+(stage[i]&&i!==cur?' done':'');b.textContent=i;b.onclick=()=>go(i);d.appendChild(b)}}
function go(n){const N=task.steps.length;if(n<1)return;if(n>N){document.getElementById('fin').scrollIntoView({behavior:'smooth'});return}
 cur=n;document.querySelectorAll('.step').forEach(e=>e.classList.toggle('on',+e.dataset.s===n));draw(n);
 document.getElementById('prev').disabled=n===1;document.getElementById('next').textContent=n===N?'Vyzkoušej sám →':'Další krok →';dots()}

/* ---------- vyzkoušej sám ---------- */
function inp(k){return `<input data-k="${k}" inputmode="decimal" autocomplete="off">`}
function finHTML(t){const f=t.fin;let h='<h2>Vyzkoušej sám</h2>';let sol='';
 if(f.type==='pairs'){h+='<table class="vys">'+f.rows.map(r=>`<tr><td>${r[0]}</td><td class="l">${r[1][0]}</td><td>${inp(r[1][1])}</td><td class="l">${r[2][0]}</td><td>${inp(r[2][1])}</td></tr>`).join('')+'</table>';
  sol='<table class="vys">'+f.rows.map(r=>`<tr><td class="k">${r[0]}</td><td class="l k">${r[1][0]}</td><td>${r[1][1]} mm</td><td class="l k">${r[2][0]}</td><td>${r[2][1]} mm</td></tr>`).join('')+'</table>'}
 if(f.type==='pairs12'){const sel=k=>`<select data-k="${k}"><option value="">–</option><option>líc</option><option>rub</option></select>`;const lr=[0,'líc','líc','rub','rub','líc','líc','rub','rub'];
  h+=`<table class="vys"><tr><td>formát A5 (mm)</td><td class="l">C</td><td>${inp(210)}</td><td class="l">D</td><td>${inp(148)}</td></tr><tr><td>zbytky (mm)</td><td class="l">E</td><td>${inp(57.5)}</td><td class="l">F</td><td>${inp(65)}</td></tr>`+[1,2,3,4].map(i=>`<tr><td>${i===1?'líc / rub':''}</td><td class="l">${i}</td><td>${sel(lr[i])}</td><td class="l">${i+4}</td><td>${sel(lr[i+4])}</td></tr>`).join('')+'</table>';
  sol=`<table class="vys"><tr><td class="k">formát A5 (mm)</td><td class="l k">C</td><td>210 mm</td><td class="l k">D</td><td>148 mm</td></tr><tr><td class="k">zbytky (mm)</td><td class="l k">E</td><td>57,5 mm</td><td class="l k">F</td><td>65 mm</td></tr>`+[1,2,3,4].map(i=>`<tr><td class="k">${i===1?'líc / rub':''}</td><td class="l k">${i}</td><td>${lr[i]}</td><td class="l k">${i+4}</td><td>${lr[i+4]}</td></tr>`).join('')+'</table>'}
 if(f.type==='inputs'){h+=f.rows.map(r=>`<div class="inrow"><label>${r[0]}</label>${inp(r[1])}</div>`).join('');sol=f.sol}
 if(f.type==='grid'){h+=`<p>${f.title}. Horní řada je otočená vzhůru nohama. Čárkovaně = hřbet.</p>`+f.grids.map(g=>`<p><b>${g[0]}</b></p><div class="gridin">${g[1].map((n,c)=>`<div class="r0 c${c}"><input class="top" data-k="${n}" inputmode="numeric"></div>`).join('')}${g[2].map((n,c)=>`<div class="c${c}"><input data-k="${n}" inputmode="numeric"></div>`).join('')}</div>`).join('');sol=f.sol()}
 h+=`<div class="msg" id="msg"></div><button class="btn grn" onclick="check()">Zkontrolovat</button><button class="btn sec" id="sb" onclick="sol()">Ukaž řešení</button>`;
 h+=`<div class="sol" id="sol"><p><b>Řešení – takhle to zapíšu do písemky:</b></p>${sol}</div>`;return h}
function num(v){v=String(v).replace(/\s/g,'').replace(',','.');const m=v.match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN}
function check(){const els=document.querySelectorAll('#fin [data-k]');let ok=0,empty=0;els.forEach(i=>{i.classList.remove('ok','bad');if(!i.value.trim()){empty++;return}
 const k=i.dataset.k;const good=isNaN(+k)?i.value===k:Math.abs(num(i.value)-(+k))<0.001;i.classList.add(good?'ok':'bad');if(good)ok++});
 const m=document.getElementById('msg');if(empty===els.length){m.style.color='#c62828';m.textContent='Nejdřív doplň aspoň jedno políčko.';return}
 m.style.color=ok===els.length?'#2f7d32':'#1f2430';m.textContent=ok===els.length?`Výborně! Vše správně ✔`:`Správně: ${ok} z ${els.length}. Červená políčka oprav.`}
function sol(){const s=document.getElementById('sol');s.classList.toggle('on');document.getElementById('sb').textContent=s.classList.contains('on')?'Skrýt řešení':'Ukaž řešení';document.getElementById('msg').textContent=''}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.k!==undefined){e.target.classList.remove('ok','bad');const m=document.getElementById('msg');if(m)m.textContent=''}});

/* ---------- směrování ---------- */
function route(){const m=location.hash.match(/^#u(\d+)$/);const H=document.getElementById('home'),K=document.getElementById('task');
 if(m&&TASKS.find(t=>t.n===+m[1])){H.innerHTML='';openTask(+m[1])}else{K.innerHTML='';H.innerHTML=home()}window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
